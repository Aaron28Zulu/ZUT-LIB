name: Build

# Checks every pull request and builds both Android APKs, so no one needs a
# machine with enough memory for a local Android build.
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build offline APK (SRS demo)
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk zutlib-offline.apk

      - name: Build cloud APK (Firebase)
        run: |
          flutter build apk --release --dart-define=BACKEND=firebase
          mv build/app/outputs/flutter-apk/app-release.apk zutlib-cloud.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zutlib-apks
          path: |
            zutlib-offline.apk
            zutlib-cloud.apk
          retention-days: 14
