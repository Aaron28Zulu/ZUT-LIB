name: zutlib
description: "ZutLib: multi-tenant past paper library and study assistant (demonstration prototype)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  crypto: ^3.0.7
  file_picker: ^13.1.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  pdfx: ^2.11.0
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/papers/
